name: Feature request
description: An idea for something new in Rackcraft, or a change to something that exists.
title: "[Idea] "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: "Check **Coming next** in the [changelog](https://github.com/azerbai/rackcraft-issues/blob/main/CHANGELOG.md) and the [won't-do list](https://github.com/azerbai/rackcraft-issues/blob/main/WONT-DO.md) first. Ideas already there are closed with a link to them."
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like to see? Describe it in game terms.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What would it let you do, or what's missing or annoying today?
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Sketches, examples from other mods, numbers you have in mind.
